<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solve - DSA Lab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- paste header and bottom nav here (Judge link active) -->
<header class="site-header">
  <a class="logo" href="index.html">&lt;/&gt; DSA <span>Lab</span></a>
  <nav class="nav">
    <a href="index.html"><i class="ico">🏠</i>Home</a>
    <a href="visualizer.html"><i class="ico">📊</i>Visualizer</a>
    <a href="judge.html" class="active"><i class="ico">⚖️</i>Judge</a>
    <a href="about.html"><i class="ico">ℹ️</i>About</a>
  </nav>
</header>
<main>
  <a href="judge.html">← All problems</a>
  <h1 id="title"></h1>
  <p id="difficulty"></p>
  <p id="statement"></p>
  <textarea id="code" rows="12" style="width:100%;font-family:monospace"></textarea>
  <button id="submitBtn">Submit</button>
  <div id="results"></div>
</main>

<script src="problems.js"></script>
<script>
const id = Number(new URLSearchParams(location.search).get("id"));
const problem = problems.find(p => p.id === id);

if (problem) {
  document.getElementById("title").textContent = problem.title;
  document.getElementById("difficulty").textContent = problem.difficulty;
  document.getElementById("statement").textContent = problem.statement;
  document.getElementById("code").value = problem.starter;
} else {
  document.getElementById("title").textContent = "Problem not found";
}
</script>

<script>
const API_URL = "https://ce.judge0.com/submissions?base64_encoded=false&wait=true";

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
}

async function runOne(code, input) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source_code: code, language_id: 71, stdin: input })
  });
  return await res.json();
}

document.getElementById("submitBtn").addEventListener("click", async () => {
  const btn = document.getElementById("submitBtn");
  const box = document.getElementById("results");
  const code = document.getElementById("code").value;
  const total = problem.tests.length;
  btn.disabled = true;
  box.textContent = "Running all " + total + " tests...";

  const results = await Promise.all(
    problem.tests.map(t => runOne(code, t.input).catch(() => null))
  );

  let passed = 0;
  let html = "";
  results.forEach((r, i) => {
    const t = problem.tests[i];
    if (!r || !r.status) {
      html += `<div class="fail">Test ${i + 1}: Judge busy or unreachable</div>`;
      return;
    }
    const got = (r.stdout || "").trim();
    const want = String(t.expected).trim();
    if (r.status.id === 3 && got === want) {
      passed++;
      html += `<div class="pass">Test ${i + 1}: Passed</div>`;
    } else if (r.status.id !== 3) {
      const err = r.compile_output || r.stderr || "";
      html += `<div class="fail">Test ${i + 1}: ${esc(r.status.description)}<pre>${esc(err)}</pre></div>`;
    } else {
      html += `<div class="fail">Test ${i + 1}: Failed<pre>Expected: ${esc(want)}\nGot: ${esc(got)}</pre></div>`;
    }
  });

  box.innerHTML = `<h3>${passed} / ${total} passed</h3>` + html;
  btn.disabled = false;
});
</script>
</body>
</html>
