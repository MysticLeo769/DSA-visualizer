<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .box { width: 20px; background: navy; }
    .comparing { background: tomato; }
    .sorted { background: aquamarine; }
    .box { color: white; font-size: 10px; text-align: center; }
    .dim { opacity: 0.25; }
    .mid { background: thistle; }
    .found { background: limegreen; }
    .stackItem { width: 80px; padding: 8px; margin: 2px 0; background: thistle; color: white; text-align: center; }
    .top { background: hwb(156 14% 6%); }
    .queueRow { display: flex; gap: 4px; }
    .qItem { width: 40px; padding: 8px 0; background: navy; color: white; text-align: center; }
    .front { background: tomato; }
    .back { background: orange; }
  </style>
</head>
<body>
  <h1>My Visualizer</h1>
  <button onclick="generate()">Generate</button>
  <button onclick="autosort()">autosort</button>
  <button id="pauseBtn" onclick="togglePause()">Pause</button>
  <button onclick="nextStep()">Next step</button>
  <br>
  <input type="number" id="target" placeholder="Target" style="width:70px">
  <button onclick="startBinarySearch()">Binary search</button>
  
  <p>Slow <input type="range" id="speed" min="50" max="1000" value="800"> Fast</p>
  <p id="status">Tap Generate to start</p>
  <div class="row" id="bars"></div>
  <p>RED = COMPARING, AQUAMARINE = SORTED</p>
  <hr>
  <h2>Stack</h2>
  <input type="number" id="stackInput" placeholder="Value" style="width:70px">
  <button onclick="stackPush()">Push</button>
  <button onclick="stackPop()">Pop</button>
  <button onclick="stackPeek()">Peek</button>
  <p id="stackStatus">Stack is empty</p>
  <div id="stackBox"></div>
  <hr>
  <h2>Queue</h2>
  <input type="number" id="queueInput" placeholder="Value" style="width:70px">
  <button onclick="enqueue()">Enqueue</button>
  <button onclick="dequeue()">Dequeue</button>
  <p id="queueStatus">Queue is empty</p>
  <div class="queueRow" id="queueBox"></div>
  <p>RED = FRONT, ORANGE = BACK</p>

  <script>
    let numbers = [];
    let pos = 0;
    let running = false;
    let paused = false;
    let stepOnce = false;
    let sortedCount = 0;

    function generate() {
      if(running) return;
      numbers = [];
      pos=0;
      sortedCount = 0;
      document.getElementById("status").innerText = "New array ready";
      
      for (let i = 0; i < 15; i++) {
        numbers.push(Math.floor(Math.random() * 41) + 10);
      }
      drawBars();
    }

    function drawBars(a, b) {
      let container = document.getElementById("bars");
      container.innerHTML = "";
      
      for (let i = 0; i < numbers.length; i++) {
        let bar = document.createElement("div");
        bar.className = "box";
        
        if (i >= numbers.length - sortedCount) {
          bar.className = "box sorted";
        }
        
        if (i === a || i === b) {
          bar.className = "box comparing";
        }
      bar.style.height = numbers[i] * 5 + "px";
      container.appendChild(bar);
    }
    }
    
    function sleep(ms){
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function getDelay() {
      return 1050 - document.getElementById("speed").value;
    }

    async function waitIfPaused() {
      while (paused && !stepOnce) {
        await sleep(50);
      }
    stepOnce = false;
    }

    function togglePause() {
      paused = !paused;
      document.getElementById("pauseBtn").innerText = paused ? "Resume" : "Pause";
    }

    function nextStep() {
      if (paused) stepOnce = true;
    }

    async function autosort() {
      if (running) return;
      running = true;
      sortedCount = 0;
      let status = document.getElementById("status");

      let swapped = true;
      while (swapped) {
        swapped = false;
        for (let i = 0; i < numbers.length - 1 - sortedCount; i++) {
          await waitIfPaused();
          let left = numbers[i];
          let right = numbers[i + 1];

        if (left > right) {
          numbers[i] = right;
          numbers[i + 1] = left;
          swapped = true;
          status.innerText = "Comparing " + left + " and " + right + ": " + left + " is bigger, so swap";
        } else {
          status.innerText = "Comparing " + left + " and " + right + ": already in order";
        }
        drawBars(i, i + 1);
        await sleep(getDelay());
      }
      sortedCount++;
    }
    sortedCount = numbers.length;
    status.innerText = "Sorted!";
    drawBars();
    running = false;
  }

function drawSearchBars(low, mid, high, foundIndex) {
  let container = document.getElementById("bars");
  container.innerHTML = "";

  for (let i = 0; i < numbers.length; i++) {
    let bar = document.createElement("div");
    bar.className = "box";
    bar.innerText = numbers[i];

    if (i < low || i > high) bar.className = "box dim";
    if (i === mid) bar.className = "box mid";
    if (i === foundIndex) bar.className = "box found";

    bar.style.height = numbers[i] * 5 + "px";
    container.appendChild(bar);
  }
}

async function startBinarySearch() {
  if (running) return;
  let status = document.getElementById("status");
  let target = parseInt(document.getElementById("target").value);

  if (numbers.length === 0) {
    status.innerText = "Tap Generate first";
    return;
  }
  if (isNaN(target)) {
    status.innerText = "Type a target number first";
    return;
  }
  for (let i = 0; i < numbers.length - 1; i++) {
    if (numbers[i] > numbers[i + 1]) {
      status.innerText = "Array is not sorted. Run autosort first";
      return;
    }
  }

  running = true;
  let low = 0;
  let high = numbers.length - 1;
  let foundIndex = -1;

  while (low <= high) {
    await waitIfPaused();
    let mid = Math.floor((low + high) / 2);
    drawSearchBars(low, mid, high, -1);

    if (numbers[mid] === target) {
      foundIndex = mid;
      status.innerText = "mid = " + numbers[mid] + " equals " + target + ": found!";
      break;
    } else if (numbers[mid] < target) {
      status.innerText = "mid = " + numbers[mid] + " is less than " + target + ", so move low right";
      await sleep(getDelay());
      low = mid + 1;
    } else {
      status.innerText = "mid = " + numbers[mid] + " is greater than " + target + ", so move high left";
      await sleep(getDelay());
      high = mid - 1;
    }
  }

  if (foundIndex === -1) {
    status.innerText = target + " is not in the array";
    drawSearchBars(0, -1, -1, -1);
  } else {
    drawSearchBars(0, -1, numbers.length - 1, foundIndex);
  }
  running = false;
}

let stack = [];
const STACK_MAX = 8;

function drawStack() {
  let container = document.getElementById("stackBox");
  container.innerHTML = "";

  // draw from top to bottom, so the newest item appears first
  for (let i = stack.length - 1; i >= 0; i--) {
    let item = document.createElement("div");
    item.className = "stackItem";
    if (i === stack.length - 1) item.className = "stackItem top";
    item.innerText = stack[i];
    container.appendChild(item);
  }
}

function stackPush() {
  let status = document.getElementById("stackStatus");
  let input = document.getElementById("stackInput");
  let value = parseInt(input.value);

  if (isNaN(value)) {
    status.innerText = "Type a number first";
    return;
  }
  if (stack.length >= STACK_MAX) {
    status.innerText = "Stack Overflow: stack is full, cannot push " + value;
    return;
  }
  stack.push(value);
  status.innerText = "Pushed " + value + " on top";
  input.value = "";
  drawStack();
}

function stackPop() {
  let status = document.getElementById("stackStatus");
  if (stack.length === 0) {
    status.innerText = "Stack Underflow: nothing to pop";
    return;
  }
  let removed = stack.pop();
  status.innerText = "Popped " + removed + " (last in, first out)";
  drawStack();
}

function stackPeek() {
  let status = document.getElementById("stackStatus");
  if (stack.length === 0) {
    status.innerText = "Stack is empty, nothing to peek";
    return;
  }
  status.innerText = "Top is " + stack[stack.length - 1] + " (not removed)";
}

let queue = [];
const QUEUE_MAX = 8;

function drawQueue() {
  let container = document.getElementById("queueBox");
  container.innerHTML = "";

  for (let i = 0; i < queue.length; i++) {
    let item = document.createElement("div");
    item.className = "qItem";
    if (i === queue.length - 1) item.className = "qItem back";
    if (i === 0) item.className = "qItem front";
    item.innerText = queue[i];
    container.appendChild(item);
  }
}

function enqueue() {
  let status = document.getElementById("queueStatus");
  let input = document.getElementById("queueInput");
  let value = parseInt(input.value);

  if (isNaN(value)) {
    status.innerText = "Type a number first";
    return;
  }
  if (queue.length >= QUEUE_MAX) {
    status.innerText = "Queue is full, cannot add " + value;
    return;
  }
  queue.push(value);
  status.innerText = "Enqueued " + value + " at the back";
  input.value = "";
  drawQueue();
}

function dequeue() {
  let status = document.getElementById("queueStatus");
  if (queue.length === 0) {
    status.innerText = "Queue is empty, nothing to remove";
    return;
  }
  let removed = queue.shift();
  status.innerText = "Dequeued " + removed + " from the front (first in, first out)";
  drawQueue();
}
  </script>
</body>
</html>
